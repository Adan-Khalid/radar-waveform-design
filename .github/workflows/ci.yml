name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (versions from uv.lock)
        run: uv sync --locked --group dev

      - name: Lint and format check
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check src scripts tests

      - name: Tests (small Monte Carlo runs, CPU only)
        run: uv run pytest -q
