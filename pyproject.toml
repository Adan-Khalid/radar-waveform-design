[project]
name = "radar-waveform-design"
version = "1.0.0"
description = "Radar Waveform Design and Matched Filtering: LFM, Phase-Coded and OFDM Pulses with Low-Bit ADC Analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adan Khalid" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radarwave"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
